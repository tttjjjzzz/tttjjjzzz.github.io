<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiger Zhou's Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Oxanium', 'sans-serif'],
                        'display': ['Oxanium', 'sans-serif'],
                        'accent': ['Raleway', 'sans-serif'],
                    },
                    maxWidth: {
                        '8xl': '90rem', // 1440px
                    }
                },
            },
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;500;600;700&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="font-sans text-gray-100 antialiased">

    <!-- Stripe WebGL Gradient Background -->
    <canvas id="gradient-canvas"></canvas>

    <!-- Scroll Progress Bar -->
    <div id="scroll-progress-bar"></div>

    <!-- Sticky Header - FULL WIDTH -->
    <header id="site-header" class="sticky top-0 z-50 w-full">
        <div class="w-full px-6 py-4">
            <div class="flex items-center justify-between w-full">

                <!-- Left Column: Name -->
                <div class="flex-shrink-0">
                    <a href="#home">
                        <h1 id="header-name" class="text-3xl font-display font-light tracking-wider text-gray-100">
                            Tiger Zhou
                        </h1>
                    </a>
                </div>

                <!-- Middle Column: Nav Links (Desktop Only) -->
                <nav class="hidden md:flex-1 md:flex md:justify-center">
                    <ul id="desktop-nav" class="flex flex-row gap-x-8">
                        <!-- Navigation generated by JavaScript -->
                    </ul>
                </nav>

                <!-- Right Column: Social Icons (Desktop Only) -->
                <div id="header-social" class="hidden md:flex flex-shrink-0 items-center gap-x-5">
                    <!-- Social icons generated by JavaScript -->
                </div>

                <!-- Mobile Menu Button (Mobile Only) -->
                <div class="md:hidden">
                    <button id="mobile-menu-button" class="text-gray-100 hover:text-purple-300 transition-colors duration-200 p-1">
                        <svg id="hamburger-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                        <svg id="close-icon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>

            </div>

            <!-- Mobile Menu Dropdown (Hidden by default) -->
            <div id="mobile-menu" class="hidden md:hidden pt-5 pb-3 border-t border-white/10 mt-4">
                <ul id="mobile-nav" class="flex flex-col space-y-4 mb-5">
                    <!-- Navigation generated by JavaScript -->
                </ul>
                <div id="header-social-mobile" class="flex items-center gap-x-5 pt-4 border-t border-white/10">
                    <!-- Social icons generated by JavaScript -->
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="max-w-8xl mx-auto px-6">

        <main>
            <!-- Home Section -->
            <section id="home" class="scroll-mt-20 min-h-screen flex items-center">
                <div id="home-content" class="w-full">
                    <!-- Content generated by JavaScript -->
                </div>
            </section>

            <!-- About Section -->
            <section id="about" class="scroll-mt-20 pt-6 md:pt-8 pb-32 md:pb-48">
                <p class="section-label">// About</p>
                <h2 class="text-5xl font-display font-light tracking-wider text-gray-100 text-center">About Me</h2>
                <div class="section-divider"></div>
                <div id="about-content">
                    <!-- Content generated by JavaScript -->
                </div>
            </section>

            <!-- Experience Section -->
            <section id="experience" class="scroll-mt-20 pt-6 md:pt-8 pb-32 md:pb-48">
                <p class="section-label">// Experience</p>
                <h2 class="text-5xl font-display font-light tracking-wider text-gray-100 text-center">Professional Experience</h2>
                <div class="section-divider"></div>

                <div id="experience-container" class="max-w-6xl mx-auto relative space-y-16">
                    <!-- Experience cards generated by JavaScript -->
                </div>
            </section>

            <!-- Projects Section -->
            <section id="projects" class="scroll-mt-20 pt-6 md:pt-8 pb-32 md:pb-48">
                <p class="section-label">// Projects</p>
                <h2 class="text-5xl font-display font-light tracking-wider text-gray-100 text-center">Projects</h2>
                <div class="section-divider"></div>

                <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8 gap-y-8 max-w-6xl mx-auto">
                    <!-- Project cards generated by JavaScript -->
                </div>
            </section>

            <!-- Contact Section -->
            <section id="contact" class="scroll-mt-20 pt-6 md:pt-8 pb-32 md:pb-48">
                <div id="contact-content">
                    <!-- Content generated by JavaScript -->
                </div>
            </section>
        </main>

        <footer class="mt-20 pt-10 border-t border-white/10 pb-16">
            <p id="copyright-text" class="text-center text-gray-400 text-sm tracking-wider">
                &copy; 2026 Tiger Zhou.
            </p>
        </footer>
    </div>

    <!-- Configuration and Data -->
    <script src="js/config.js"></script>
    <!-- Component Builders -->
    <script src="js/components.js"></script>
    <!-- Mobile Menu Toggle -->
    <script src="js/mobile-menu.js"></script>
    <!-- WebGL Gradient -->
    <script src="js/gradient.js"></script>

</body>
</html>
